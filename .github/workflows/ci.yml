name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-scan:
    name: Safety boundary scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run safety scan
        shell: pwsh
        run: ./scripts/safety-scan.ps1

      - name: Verify violation fixture marker
        shell: pwsh
        run: |
          $content = Get-Content tools/safety-fixtures/ForbiddenInputSimulation.java -Raw
          if ($content -notmatch 'SendInput') { throw 'fixture missing SendInput marker' }
          Write-Host 'Fixture marker present'

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: safety-scan
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build, test, and package
        run: mvn -B -ntp clean verify

      - name: Enforcer & dependency tree
        run: |
          mvn -B -ntp dependency:tree -Dverbose=false | tee dependency-tree.txt
          # Only inspect dependency coordinate lines; ignore reactor summary noise.
          if grep -E 'SNAPSHOT' dependency-tree.txt \
            | grep -E '\[INFO\] [\\|+-]' \
            | grep -v 'com.tft.coach'; then
            echo "Undeclared external SNAPSHOT dependency detected"
            exit 1
          fi

      - name: Upload dependency tree
        uses: actions/upload-artifact@v5
        with:
          name: dependency-tree
          path: dependency-tree.txt

      - name: Upload orchestrator jar
        uses: actions/upload-artifact@v5
        with:
          name: tft-orchestrator-jar
          path: tft-orchestrator/target/*.jar
