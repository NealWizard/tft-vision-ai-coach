stages:
  - safety
  - build
  - test
  - verify

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  JAVA_VERSION: "21"

default:
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: "${CI_COMMIT_REF_SLUG}-m2"
    paths:
      - .m2/repository

# P0-004: safety boundary must fail the pipeline on forbidden patterns
safety:scan:
  stage: safety
  image: mcr.microsoft.com/powershell:lts-ubuntu-22.04
  script:
    - pwsh -File scripts/safety-scan.ps1
  rules:
    - if: $CI_PIPELINE_SOURCE

# Prove scanner detects intentional fixture marker
safety:fixture-selfcheck:
  stage: safety
  image: mcr.microsoft.com/powershell:lts-ubuntu-22.04
  script:
    - |
      pwsh -Command "
        `$content = Get-Content tools/safety-fixtures/ForbiddenInputSimulation.java -Raw
        if (`$content -notmatch 'SendInput') { throw 'fixture missing SendInput marker' }
        Write-Host 'Fixture marker present — scanner allowlists tools/safety-fixtures only'
      "
  allow_failure: false

compile:
  stage: build
  script:
    - java -version
    - mvn -B -ntp clean compile
  artifacts:
    paths:
      - "*/target/classes"
    expire_in: 1 hour

unit-test:
  stage: test
  script:
    - mvn -B -ntp test
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    expire_in: 7 days

static-check:
  stage: verify
  script:
    - mvn -B -ntp enforcer:enforce
    - mvn -B -ntp dependency:tree -Dverbose=false | tee dependency-tree.txt
    - |
      if grep -E 'SNAPSHOT' dependency-tree.txt | grep -v 'com.tft.coach' | grep -v 'Building\|Downloading\|Downloaded' ; then
        echo "Undeclared external SNAPSHOT detected"
        exit 1
      fi
  artifacts:
    paths:
      - dependency-tree.txt
    expire_in: 7 days

package:
  stage: verify
  script:
    - mvn -B -ntp -DskipTests package
  artifacts:
    paths:
      - tft-orchestrator/target/*.jar
    expire_in: 7 days
  needs:
    - unit-test
    - static-check
    - safety:scan
