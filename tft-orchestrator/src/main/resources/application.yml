tft:
  flags:
    offline-lab: true
    post-game: true
    pre-game-meta: true
    live-experiment: false
    live-dynamic-recommendation: false
    live-opponent-analysis: false
  platform:
    # auto | offline | online
    mode: auto
    patch: set18-16.17
    env-file: .env
    seed-datadragon: false
    snapshot-dir: data/snapshots
  rag:
    index: tft_rag_chunks
    embedding-dims: 1024
  research:
    provider: tavily
  vision:
    sidecar:
      base-url: http://127.0.0.1:19090
      auto-start: false
      connect-timeout-ms: 500
      read-timeout-ms: 2000
      analyze-timeout-ms: 15000
    profile:
      default-id: 1920x1080-default
    cloud:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name:tft},%X{correlation_id},%X{agent_run_id}]"
  level:
    com.tft.coach: INFO

spring:
  application:
    name: tft-orchestrator
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
